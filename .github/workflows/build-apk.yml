name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned certificate fingerprint of the Oto signing key (public information, safe to commit).
env:
  OTO_CERT_SHA256: 4a4a9d1a9290c2e5015aba007079bc8e7cbdd9455168fbdbceb04735116bb76e

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.OTO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oto.p12"
            echo "OTO_KEYSTORE_PATH=$RUNNER_TEMP/oto.p12" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets here (pull request or fork). Using the debug key."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests and build
        env:
          OTO_KEYSTORE_PASSWORD: ${{ secrets.OTO_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew testDebugUnitTest assembleRelease --stacktrace
          else
            ./gradlew testDebugUnitTest assembleDebug --stacktrace
          fi

      - name: Room schema must be committed
        run: |
          git add -N app/schemas 2>/dev/null || true
          if ! git diff --quiet -- app/schemas; then
            echo "::error::The Room schema changed but is not committed. Commit app/schemas and add a migration."
            git --no-pager diff -- app/schemas
            exit 1
          fi

      - name: Verify the APK is signed with the Oto key
        if: env.SIGNED == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK certificate: $GOT"
          if [ "$GOT" != "$OTO_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the expected Oto key. Installing it over the old app would fail."
            exit 1
          fi
          mv "$APK" app/build/outputs/apk/release/oto.apk

      - name: Upload signed APK
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oto-apk
          path: app/build/outputs/apk/release/oto.apk
          if-no-files-found: error

      - name: Upload debug APK (unsigned-by-Oto, for pull requests)
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
